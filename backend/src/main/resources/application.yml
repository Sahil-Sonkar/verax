verax:
  app-name: Verax
  jwt:
    secret: ${VERAX_JWT_SECRET:change-me-in-production-use-a-long-random-string-at-least-256-bits-long!!}
    ttl: ${VERAX_JWT_TTL:30d}
  seed: ${VERAX_SEED:true}
  upload-dir: ${VERAX_UPLOAD_DIR:./uploads}
  streak-threshold: 0.5
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    apple-client-id: ${APPLE_CLIENT_ID:}
  usda-api-key: ${USDA_API_KEY:DEMO_KEY}
  ninjas-api-key: ${NINJAS_API_KEY:}

spring:
  application:
    name: verax
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/verax}
    username: ${DATABASE_USER:${USER:}}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Fly's Postgres proxy drops idle connections well inside Hikari's 30-minute
      # default, so the pool handed out dead sockets and /actuator/health spent
      # 20s revalidating them past the 5s check timeout. Recycle and ping under that window.
      max-lifetime: 240000
      keepalive-time: 60000
      validation-timeout: 3000
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.verax: INFO
    org.springframework.security: WARN
