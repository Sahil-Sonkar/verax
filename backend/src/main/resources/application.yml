verax:
  app-name: Verax
  jwt:
    secret: ${VERAX_JWT_SECRET:change-me-in-production-use-a-long-random-string-at-least-256-bits-long!!}
    ttl: ${VERAX_JWT_TTL:30d}
  seed: ${VERAX_SEED:true}
  upload-dir: ${VERAX_UPLOAD_DIR:./uploads}
  streak-threshold: 0.5
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    apple-client-id: ${APPLE_CLIENT_ID:}
  usda-api-key: ${USDA_API_KEY:DEMO_KEY}
  ninjas-api-key: ${NINJAS_API_KEY:}

spring:
  application:
    name: verax
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/verax}
    username: ${DATABASE_USER:${USER:}}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # ponytail: tuned small because the Fly Postgres machine is shared-cpu-1x:256MB and
      # runs at ~60% full memory pressure. Its haproxy check then times out every ~40s and
      # drops every backend at once, killing the whole pool. Fewer, shorter-lived connections
      # ease the memory pressure and recover faster; the real ceiling is DB RAM, so the
      # upgrade path is `fly machine update --vm-memory 1024 -a verax-sonkar-db`.
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 240000
      keepalive-time: 60000
      validation-timeout: 3000
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.verax: INFO
    org.springframework.security: WARN
