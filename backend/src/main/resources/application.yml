verax:
  app-name: Verax
  jwt:
    secret: ${VERAX_JWT_SECRET:change-me-in-production-use-a-long-random-string-at-least-256-bits-long!!}
    ttl: 7d
  seed: ${VERAX_SEED:true}
  upload-dir: ${VERAX_UPLOAD_DIR:./uploads}
  streak-threshold: 0.5
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    apple-client-id: ${APPLE_CLIENT_ID:}

spring:
  application:
    name: verax
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/verax}
    username: ${DATABASE_USER:${USER}}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.verax: INFO
    org.springframework.security: WARN
